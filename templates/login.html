{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<div class="login card">
  <img src="{{ url_for('static', filename='logo-pings.png') }}" alt="Workspace6 Pings">
  <h2>Sign in</h2>
  <form method="post" style="margin-top:20px">
    <div class="field"><label>Name</label><input type="text" name="user" autocomplete="username" autocapitalize="none" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div>
    <button type="submit" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
