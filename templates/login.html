{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block bodyclass %}login-page{% endblock %}
{% block page %}
<div class="login-bg" aria-hidden="true"></div><div class="login-glow" aria-hidden="true"></div>
<div class="login-box">
  <div class="login-logo" role="img" aria-label="Workspace6 Pings"></div>
  <div class="login-card">
    {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
    <h1>Welcome back</h1>
    <p class="lede">Your sponsor pings, all in one place.</p>
    <form method="post" action="{{ url_for('login') }}{{ ('?next=' ~ (request.args.get('next')|urlencode)) if request.args.get('next') else '' }}" id="login-form" name="login" autocomplete="on">
      <div class="field"><label for="username">Name</label><input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <div class="login-foot">Workspace6 · Partnerships</div>
</div>
{% endblock %}
